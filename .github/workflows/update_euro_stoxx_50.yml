name: Update Euro Stoxx 50 Table

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # Executa todos os dias às 07:00 UTC

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas beautifulsoup4 lxml requests

      - name: Run Euro Stoxx 50 update script
        run: python update_euro_stoxx_50.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add euro-stoxx-50-table/euro-stoxx-50-table.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Euro Stoxx 50 table [skip ci]" && git push)
